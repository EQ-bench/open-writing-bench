[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-writing-bench"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  # Core dependencies
  "alembic>=1.17.0",
  "joblib>=1.5.2",
  "nltk>=3.9.2",
  "numpy<2.3",
  "psycopg2-binary>=2.9.11",
  "python-dotenv>=1.1.1",
  "pyyaml>=6.0.3",
  "requests>=2.32.5",
  "scipy",
  "sqlalchemy>=2.0.44",
  "tqdm>=4.67.1",
  "trueskill>=0.4.5",
  "wordfreq>=3.1.1",
  "spacy>=3.7.0",
  # spaCy model for lexical analysis (installed from GitHub releases)
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "hf_transfer",
  # Transformers backend (installed via uv)
  #"transformers>=4.45.0",  
  #"accelerate>=0.30.0",
  #"bitsandbytes>=0.43.0",
  #"sentencepiece>=0.2.0",
  #"protobuf>=4.25.0",
  #"safetensors>=0.4.0",
  "huggingface-hub>=0.24.0",
  #"tokenizers>=0.19.0",
  #"torch>=2.0.0",
  #"torch==2.8.0",
  #"flash-attn==2.8.3",
  #"vllm==0.11.0"
  # Note: vllm, llama-cpp-python, flash-attn require manual installation
  # See INSTALL.md for instructions
]

[project.scripts]
bench = "open_writing_bench:main"
ensure-db = "alembic.ensure_db:main"
scheduler = "scheduler.service:main"

# Only install the Python packages you actually import.
[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["core", "core.analysis", "utils", "utils.inference", "alembic", "scheduler"]
exclude = ["config*", "data*"]

# Also install top-level single-file modules as importable modules.
[tool.setuptools]
py-modules = ["open_writing_bench", "creative_writing_bench"]

[tool.uv]
package = true
