# Scheduler configuration for open-writing-bench
# Environment variables in .env take precedence for secrets (DATABASE_URL, etc.)

[scheduler]
# How often to check for new submissions (seconds)
poll_interval_sec = 10

# How often to stream logs to run_logs table (seconds)
log_stream_interval_sec = 10

# Hard limit for job runtime (seconds). Default 2 hours.
hard_timeout_sec = 7200

# Max attempts before marking as FAILED
max_attempts = 1

[defaults]
# Default thread count for benchmark runs
threads = 34

# Default verbosity
verbosity = DEBUG

# Default test provider (vllm for local GPU)
test_provider = vllm

# Default judge models if not specified in submission params
default_judges = grok-4.1-fast,claude-haiku-4.5,kimi-k2-0905

[cleanup]
# Whether to clear HuggingFace cache after each job
clear_hf_cache = true

# Whether to kill any remaining vLLM processes after each job
kill_vllm_processes = true

[queue]
# Queue ordering and rate limiting settings
# These control fairness and prevent abuse

# How often to recalculate priority scores (seconds)
priority_update_interval_sec = 60

# Hard limits - submissions exceeding these are HELD until window expires
max_cost_per_user_24h = 10.0
max_cost_per_ip_24h = 10.0
max_runtime_per_user_24h_hours = 8.0
max_runtime_per_ip_24h_hours = 8.0
max_concurrent_per_user = 3
max_concurrent_per_ip = 5

# Rolling window for calculating usage (hours)
window_hours = 24

# Priority scoring weights (higher = more impact on queue order)
# Users/IPs with lower usage get higher priority
weight_low_cost = 10.0
weight_low_runtime = 5.0
